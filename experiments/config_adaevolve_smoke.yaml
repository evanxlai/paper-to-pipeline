# Cheap smoke-test variant of config_adaevolve.yaml: just enough iterations
# to prove the EvolverNode -> ChiaEvaluator -> CBP2025Node wiring actually
# runs end-to-end (build succeeds, screening traces run, a score comes
# back) without burning the full 250-iteration/pop-48 search budget.
# Not for a real DSE run -- see config_adaevolve.yaml for that.

max_iterations: 3
file_suffix: .h
checkpoint_interval: 1
random_seed: 20260911
diff_based_generation: true
max_parallel_iterations: 1

search:
  type: adaevolve
  database:
    population_size: 2
    num_islands: 1

llm:
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: ${GEMINI_API_KEY}
  models:
    - name: gemini-3.5-flash
      weight: 1.0

prompt:
  system_message: >
    You tune parameters of the sR register-value statistical-corrector
    component inside a fixed total storage budget. Mutate only the values
    in sr_params.h. Keep every value inside the range comment on its line.
    The evaluator rejects candidates whose accounted storage exceeds the
    budget, so trading table sizes against the base predictor's donors is
    the interesting move, not growing everything.
