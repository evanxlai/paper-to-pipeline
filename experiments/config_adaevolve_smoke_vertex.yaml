# Smoke-test config routed through the project LLM gateway
# (loop/llm_gateway.py), which forwards to Vertex AI. This project has no
# usable GEMINI_API_KEY -- the public endpoint is unfunded here and returns
# 402 -- but its GCP project has aiplatform.googleapis.com enabled and ADC
# works, and the gateway turns that into a non-expiring interface.
#
# This config used to carry ${VERTEX_ACCESS_TOKEN} directly, which worked
# only for runs shorter than the ~1h ADC token lifetime. The gateway removes
# that limit; api_key below is now the gateway's shared secret.
#
# Two non-obvious things make this work (both verified against
# skydiscover/skydiscover/config.py, not guessed):
#
#  1. The model MUST be named "google/<model>", not "gemini-<model>".
#     skydiscover's LLMConfig.__post_init__ runs _parse_model_spec() on each
#     model name; anything starting with "gemini-" matches _BARE_PREFIX_MAP
#     and gets its api_base FORCIBLY overwritten with the public
#     generativelanguage.googleapis.com endpoint, silently discarding the
#     api_base set here. "google/..." is not a registered provider, so it
#     falls through to the openai default, which -- combined with a custom
#     api_base below -- trips the `not (user_set_api_base and is_fallback)`
#     guard and leaves our api_base intact. It also skips the provider-prefix
#     strip (that only fires when provider != "openai"), so the model name
#     reaches Vertex as "google/gemini-3.8-flash", which is exactly the form
#     its openapi endpoint expects.
#  2. api_base/api_key here are applied via update_model_params(...,
#     overwrite=False), so they only land if the per-model fields are None.
#     Point 1 is what keeps them None.
#
# ${P2P_GATEWAY_TOKEN} is expanded by Config.from_yaml -> _expand_env_vars,
# which reads os.environ *in the EvolverNode actor process* -- so it must be
# passed through the driver's ray.init(runtime_env={"env_vars": ...}), not
# just exported in a shell. loop/constants.py forwards it.
#
# Model availability is project-specific AND drifts: the handover doc
# recorded google/gemini-3.8-flash as serving on "global" only, but on
# re-probe (2026-09-20) it returns 200 on us-central1 too, as does
# google/gemini-2.5-flash. Re-probe before assuming either way; the gateway
# routes model -> location via P2P_GATEWAY_MODEL_LOCATIONS.

max_iterations: 3
file_suffix: .h
checkpoint_interval: 1
random_seed: 20260911
diff_based_generation: true
max_parallel_iterations: 1

search:
  type: adaevolve
  database:
    population_size: 2
    num_islands: 1

llm:
  # Substituted by skydiscover's Config.from_yaml from the EvolverNode
  # actor's own environment, which loop/constants.py fills from
  # $HEAD_IP. It was a hardcoded 10.128.0.2 and the head has since
  # moved to another address, which is an opaque connection refused
  # rather than a config error.
  api_base: ${P2P_GATEWAY_URL}
  api_key: ${P2P_GATEWAY_TOKEN}
  models:
    - name: google/gemini-3.8-flash
      weight: 1.0

prompt:
  system_message: >
    You tune parameters of the sR register-value statistical-corrector
    component inside a fixed total storage budget. Mutate only the values
    in sr_params.h. Keep every value inside the range comment on its line.
    Trading one table's size against another is the interesting move, not
    growing everything: the total storage is what the budget is about.
    (The evaluator does not yet reject an over-budget candidate. Storage
    accounting is stage 4's to add, and until it exists this sentence is
    the only thing holding the budget.)
