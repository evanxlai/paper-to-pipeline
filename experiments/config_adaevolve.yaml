# evolve-flows search config for the iso-budget DSE stage (loop/dse.py).
# Modeled on evolve-flows examples/alphaevolve-champsim-simple/config_adaevolve.yaml.
# Backend: AdaEvolve (local SkyDiscover).
#
# Gemini rides the project LLM gateway (loop/llm_gateway.py), which forwards
# to Vertex AI with a freshly-refreshed bearer per request. That is what makes
# a 250-iteration (~37h) search possible at all: a raw Vertex bearer lives
# ~60 minutes and skydiscover freezes it into its OpenAI client at startup,
# so the unproxied route dies with 401 UNAUTHENTICATED partway through.
#
# This config previously pointed at generativelanguage.googleapis.com with
# ${GEMINI_API_KEY}. That route is unfunded on this project -- it draws on a
# separate AI Studio prepay pool and returns 402 "prepayment credits
# depleted" on every model, while Vertex returns 200 with
# traffic_type: ON_DEMAND. Do not point it back without re-probing both.
#
# Swap to config_alphaevolve.yaml (search.type: alphaevolve) if the GCP
# project has AlphaEvolve API access.

max_iterations: 250
file_suffix: .h            # candidates are sr_params.h header mutations
checkpoint_interval: 25
random_seed: 20260911
diff_based_generation: true
max_parallel_iterations: 8

search:
  type: adaevolve
  database:
    population_size: 48
    num_islands: 4

llm:
  # The gateway on the head. ${P2P_GATEWAY_TOKEN} is the gateway's shared
  # secret, NOT a Google credential, and it does not expire. Both are
  # expanded by Config.from_yaml -> _expand_env_vars, which reads os.environ
  # *in the EvolverNode actor process* -- so they must arrive through the
  # driver's ray.init(runtime_env={"env_vars": ...}); exporting them in your
  # shell alone is not enough (loop/constants.py forwards them).
  # Substituted by skydiscover's Config.from_yaml from the EvolverNode
  # actor's own environment, which loop/constants.py fills from
  # $HEAD_IP. It was a hardcoded 10.128.0.2 and the head has since
  # moved to another address, which is an opaque connection refused
  # rather than a config error.
  api_base: ${P2P_GATEWAY_URL}
  api_key: ${P2P_GATEWAY_TOKEN}
  models:
    # skydiscover.config.LLMConfig builds each entry as LLMModelConfig(**m);
    # a bare string here throws (must be a mapping), unlike the docs example
    # this was drafted from at a glance.
    #
    # The "google/" prefix is MANDATORY and is not cosmetic. Any name starting
    # "gemini-" matches skydiscover's _BARE_PREFIX_MAP, and
    # LLMConfig.__post_init__ then force-overwrites api_base with the public
    # endpoint (config.py:197-208) -- silently discarding the gateway URL
    # above, inside skydiscover's own process, before any request is made.
    # The gateway cannot defend against this; only the prefix can.
    - name: google/gemini-3.5-flash          # proposal mutations (cheap, many)
      weight: 1.0
    - name: google/gemini-3.1-pro-preview    # periodic high-effort rewrites
      weight: 1.0

prompt:
  system_message: >
    You tune one params header, sr_params.h, for the sR register-value
    statistical-corrector component and the TAGE-SC-L predictor it sits in.
    SR_* macros size sR; HOST_* macros size the host predictor's own
    structures. Mutate only the values. Keep every value inside the range
    comment on its line, and write plain literals, not expressions. The
    constraint lines at the top of the header are enforced: the evaluator
    recomputes each candidate's storage from its values, with the formulas
    listed at the bottom of the header, and a candidate that breaks a
    constraint is not built and scores below every candidate that fits. Its
    feedback lists where the bits went. Paying for sR by shrinking the host
    structures that matter least is the interesting move, not growing
    everything.
