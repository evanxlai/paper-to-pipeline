# CHIA cluster for the adopt-a-paper loop: local head + GCP spot workers,
# fully managed tailnet (CHIA runs tailscale everywhere).
# Modeled on chia/examples/tailscale/cluster_gcp_fullymanaged.yaml.
#
# Env vars to export before `chia up cluster/cluster.yaml`:
#   HEAD_IP               this machine's real IP/hostname (how CHIA SSHes to it)
#   TS_AUTHKEY            reusable, pre-authorized tailscale auth key
#   GCP_PROJECT           the Free Trial project id (docs/gcp-setup.md)
#   GCP_PRIVATE_KEY_PATH  private key; its .pub is injected into VM metadata
#   GOOGLE_CLOUD_PROJECT  same project id, for the LLM containers
#
# Prereqs on this machine (see docs/gcp-setup.md):
#   pip install google-cloud-compute
#   gcloud auth application-default login
#   gcloud auth application-default set-quota-project $GCP_PROJECT
#   Compute Engine API enabled; conda env "chia_env" with ray + chia on every machine.
#
# NOTE (draft): worker_setup_commands below sketch the simulator/trace
# provisioning. Traces download from Google Drive because chia gives GCP
# instances no service account, so they cannot read the project's GCS bucket
# (see the cbp2025_worker block). The simulator and host checkouts are also
# built from source on every fresh node. Bake all of it into a custom image
# before real DSE runs; re-downloading 14 GiB per node wastes time and credit.

cluster_name: paper2pipeline

#tailnet:
#    manage_all: true
#    auth_key: ${TS_AUTHKEY}
#    socks_proxy: 127.0.0.1:1155

provider:
    head_ip: ${HEAD_IP}

auth:
    ssh_user: ${USER}

gcp_nodes:
    project: ${GCP_PROJECT}
    zone: us-central1-a
    # Trace-run fleet for the CBP2025 screening fan-out. On-demand (not spot):
    # spot preemption was killing long-running baseline/dse jobs mid-run and
    # chia has no auto-heal watchdog to refill preempted nodes (see
    # docs/handover-spot-preemption.md).
    sim_worker:
        #machine_type: c2d-standard-32
        #machine_type: n1-standard-1
        #machine_type: e2-small  # too weak: make -j OOMs at 2GB RAM (ray.exceptions.OutOfMemoryError)
        #machine_type: n2-standard-4  # 4 vCPU each; head(4)+host_worker(2)+2x this(8)=14 > this project's 12-vCPU CPUS_ALL_REGIONS quota
        machine_type: n2-standard-2  # same 2 vCPU as e2-small but 8GB RAM (vs. 2GB) -- fits the quota and fixes the OOM
        count: 2
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
        disk_size_gb: 100
        spot: false
        ssh_user: laievan
        ssh_private_key: ${GCP_PRIVATE_KEY_PATH}
    # Integration host: on-demand (agents keep long-lived state in the checkouts).
    host_worker:
        #machine_type: c2d-standard-16
        #machine_type: n1-standard-1
        machine_type: e2-small
        count: 1
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
        disk_size_gb: 200
        spot: false
        ssh_user: laievan
        ssh_private_key: ${GCP_PRIVATE_KEY_PATH}

available_node_types:

    # 32 fractional slots per VM: one single-threaded ./cbp process per trace.
    cbp2025_worker:
        resources: {"cbp2025": 32}
        num_workers: 2
        compatible_ips: ["@sim_worker:0", "@sim_worker:1"]
        worker_env_commands: ["source ~/.bashrc && conda activate chia_env"]
        worker_setup_commands:
            - sudo apt-get install -y build-essential zlib1g-dev
            - test -d ~/cbp2025 || git clone https://github.com/ramisheikh/cbp2025 ~/cbp2025
            - cd ~/cbp2025 && make -j
            # The kit's own tiny bundled traces, symlinked into P2P_TRACE_DIR
            # so experiments/smoke-5.list's fast-iteration first line resolves
            # without waiting on the training-set download below.
            - >
              mkdir -p ~/traces/cbp2025/int ~/traces/cbp2025/fp &&
              ln -sf ~/cbp2025/sample_traces/int/sample_int_trace.gz ~/traces/cbp2025/int/sample_int_trace.gz &&
              ln -sf ~/cbp2025/sample_traces/fp/sample_fp_trace.gz ~/traces/cbp2025/fp/sample_fp_trace.gz
            # 105-trace training set (the "competition" set contestants get;
            # NOT Zenodo 15883615, which also bundles the held-out scoring
            # traces). ~11.7 GiB compressed; each sim_worker needs its own
            # full local copy since any node can draw any trace.
            #
            # This downloads from Google Drive, NOT from the project's GCS
            # bucket, and that is deliberate. An in-region
            # `gcloud storage rsync` from gs://a3-chia-hack26ath-7728-cbp2025
            # was tried and reverted: it fails on a fresh worker with
            # "You do not currently have an active account selected". chia
            # provisions GCP instances with NO service account attached --
            # the metadata server 404s on
            # instance/service-accounts/default/email -- and
            # chia/cluster/gcp_nodes.py has no service_account or scopes
            # option to change that. So a worker has no Google credentials of
            # any kind and cannot read the bucket, however open the project
            # IAM is.
            #
            # This is a missing identity, not an impossibility. chia's
            # config.py turns every unrecognised key in a node block into
            # extra_args and deep-merges them onto the Instance proto, which
            # has a service_accounts field. Adding this beside machine_type
            # above should give the worker an identity without patching chia:
            #
            #   service_accounts:
            #     - email: 489157157403-compute@developer.gserviceaccount.com
            #       scopes: ["https://www.googleapis.com/auth/devstorage.read_only"]
            #
            # Untested: the code path and proto field were read, not booted.
            # Both prerequisites do hold (the SA exists and is enabled, and
            # the account running `chia up` has roles/editor, hence
            # iam.serviceAccounts.actAs). Verify on one worker, then the GCS
            # sync below can replace the Drive download. See docs/gcp-setup.md.
            #
            # The bucket is still the canonical verified copy (105 objects,
            # 14.0 GiB, checked against experiments/training-105.list; see
            # docs/gcp-setup.md) and is what a custom image should be built
            # from. Baking the traces into an image is the real fix for the
            # ~10min re-download, per the NOTE at the top of this file.
            #
            # Guard checks a real training-set file, not just the directory:
            # the sample-trace symlinks above already create ~/traces/cbp2025/int.
            - >
              test -f ~/traces/cbp2025/int/int_0_trace.gz || (
              source ~/.bashrc && conda activate chia_env &&
              pip install -q gdown &&
              mkdir -p ~/traces/_dl_cbp2025 ~/traces/cbp2025 &&
              cd ~/traces/_dl_cbp2025 &&
              gdown https://drive.google.com/drive/folders/10CL13RGDW3zn-Dx7L0ineRvl7EpRsZDW --continue --retries 3 &&
              for f in traces/*.tar.xz; do tar -xJf "$f" -C ~/traces/cbp2025/; done &&
              rm -rf ~/traces/_dl_cbp2025
              )
            # Fail loudly here rather than letting every ./cbp invocation open
            # a missing trace: aggregate() turns a failed run into n=0, which
            # _map_results turns into combined_score 0.0, so a broken download
            # looks like a healthy search that learns nothing.
            - >
              test -f ~/traces/cbp2025/int/int_0_trace.gz ||
              { echo "trace download failed -- ~/traces/cbp2025 is not populated"; exit 1; }

    # ChampSim + gem5 checkouts for the integration agents and gate runs.
    host_worker:
        resources: {"champsim": 4, "gem5": 4}
        num_workers: 1
        compatible_ips: ["@host_worker:0"]
        worker_env_commands: ["source ~/.bashrc && conda activate chia_env"]
        worker_setup_commands:
            - sudo apt-get install -y build-essential scons python3-dev zlib1g-dev
            - test -d ~/ChampSim || git clone https://github.com/ChampSim/ChampSim ~/ChampSim
            - test -d ~/gem5 || git clone --branch v25.1.0.0 --depth 1 https://github.com/gem5/gem5 ~/gem5
            # TODO: ChampSim vcpkg bootstrap; gem5 scons prebuild; trace sync

    # Gemini agent (Antigravity CLI). Sign in with `agy` on the head machine
    # first so ~/.gemini exists; the mount must be writable.
    antigravity_llm:
        resources: {"antigravity_creds": 2}
        num_workers: 1
        compatible_ips: ["${HEAD_IP}"]
        docker:
            image: ghcr.io/ucb-bar/chia-antigravity:latest
            container_name: p2p_agy_${USER}
            run_options:
                - --user $(id -u):$(id -g)
                - -v ${HOME}/.gemini:/home/ray/.gemini
            run_setup_commands:
                - 'echo "user:x:$(id -u):$(id -g)::/home/ray:/bin/bash" >> /etc/passwd'

head_env_commands: ["source ~/.bashrc && conda activate chia_env"]

head_start_ray_commands:
    - ray stop
    # "evolver": evolve_flows.evolver.node.EvolverNode/run_evolver both request
    # {"evolver": 1.0} for placement; nothing else in this cluster advertises
    # it, so without this the DSE stage hangs the same way baseline did when
    # a resource tag had no node behind it.
    - ray start --head --port=6379 --dashboard-agent-listen-port=0 --resources='{"head":4,"evolver":2}'

worker_start_ray_commands:
    - ray stop
    - ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0
